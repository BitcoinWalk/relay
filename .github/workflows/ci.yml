name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - name: Verify locked modules
        run: go mod verify
      - name: Test, race detector and static analysis
        run: ./test-report.sh
      - name: Build static relay and audit tools
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags='-s -w' -o /tmp/bitcoinwalk-relay .
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags='-s -w' -o /tmp/replica-audit ./cmd/replica-audit
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags='-s -w' -o /tmp/nip29-audit ./cmd/nip29-audit
      - name: Upload static relay
        uses: actions/upload-artifact@v4
        with:
          name: bitcoinwalk-relay-linux-amd64
          path: /tmp/bitcoinwalk-relay
          if-no-files-found: error
          retention-days: 7
