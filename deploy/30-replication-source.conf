[Service]
Environment=RELAY_REPLICA_JOURNAL=/var/lib/bitcoinwalk-relay/replication-journal.db
Environment=RELAY_REPLICA_REGISTRY=/etc/bitcoinwalk-replication/registry.json
Environment=RELAY_REPLICA_DELIVERY_KEY_FILE=%d/replica-delivery-key
LoadCredential=replica-delivery-key:/etc/bitcoinwalk-replication/replica-delivery-key
