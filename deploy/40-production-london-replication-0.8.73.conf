[Service]
Environment=RELAY_REPLICA_JOURNAL=/var/lib/bitcoinwalk-relay-production/replication-journal.db
Environment=RELAY_REPLICA_REGISTRY=/etc/bitcoinwalk-replication-production/registry.json
Environment=RELAY_REPLICA_DELIVERY_KEY_FILE=%d/replica-delivery-key
LoadCredential=replica-delivery-key:/etc/bitcoinwalk-replication/replica-delivery-key
Environment=RELAY_REPLICA_REQUIRE_ENTITLEMENTS=true
Environment=RELAY_REPLICA_ENTITLEMENT_LEDGER=/etc/bitcoinwalk-replication-production/entitlements.json
Environment=RELAY_REPLICA_ENTITLEMENT_AUTHORITY=__ENTITLEMENT_AUTHORITY__
Environment=RELAY_VERSION=bitcoinwalk-production-london-0.8.73
